<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raghad - Elsie Pearl</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital@0;1&family=Great+Vibes&family=Italiana&display=swap');
  *{box-sizing:border-box}
  body{margin:0; background:#F6EFE6; color:#5A5148; text-align:center; font-family:'Cormorant Garamond',serif}
  .top{font-size:11px; letter-spacing:5px; padding:30px 10px 0; color:#9A8D7A; font-family:'Italiana',serif}
  h1{font-family:'Great Vibes',cursive; font-size:82px; margin:5px 0 0; color:#5C5342; font-weight:normal; line-height:1}
  .elsie{font-family:'Italiana',serif; letter-spacing:6px; font-size:14px; color:#9A8D7A; margin-top:4px}
  .tag{font-style:italic; font-size:19px; color:#8A7D6A; margin:14px 20px 22px}
  .hero{width:92%; max-width:720px; border-radius:22px; border:6px solid white; box-shadow:0 15px 30px rgba(0,0,0,.08); margin:auto; display:block; object-fit:cover; height:380px; background:#EAD9C2}
  .hint{font-size:13px; letter-spacing:2px; color:#B3A68E; margin:14px 0}
  #gallery{display:grid; grid-template-columns:repeat(2,1fr); gap:14px; padding:10px 20px 20px; max-width:760px; margin:auto}
  #gallery img{width:100%; height:260px; object-fit:cover; border-radius:18px; border:5px solid white; box-shadow:0 10px 22px rgba(0,0,0,.07)}
  .empty{grid-column:1/-1; padding:24px; color:#A79B86; font-style:italic}
  .cover-upload{margin:12px auto 0; display:block}
  @media(max-width:520px){.hero{height:280px} #gallery{gap:10px; padding:10px} #gallery img{height:190px}} 
  .card{position:relative}
  .card button{position:absolute; top:8px; left:8px; border:none; background:#EAD9C2; color:#5C5342; border-radius:50%; width:28px; height:28px; cursor:pointer}
  .upload{background:#FFFEFA; border:1px dashed #D8C9AE; width:88%; max-width:560px; margin:10px auto; padding:22px; border-radius:24px; cursor:pointer}
  .upload b{font-size:20px; letter-spacing:1px; font-family:'Italiana',serif}
  .upload p{font-size:15px; color:#A79B86; margin:6px 0 0; font-style:italic}
  .footer{padding:20px; font-size:12px; letter-spacing:4px; color:#9A8D7A; font-family:'Italiana',serif}
  .btn{padding:11px 22px; border:1px solid #D8C9AE; background:transparent; border-radius:30px; cursor:pointer; font-family:inherit; font-size:15px; color:#5C5342}
</style>
</head>
<body>

<div class="top">ROMANTIC . TIMELESS . FEMININE</div>
<h1>Raghad</h1>
<div class="elsie">ELSIE PEARL</div>
<div class="tag">where little moments become pearls.</div>

<img class="hero" id="hero" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 600'%3E%3Cdefs%3E%3ClinearGradient id='g' x2='0' y2='1'%3E%3Cstop stop-color='%23ead9c2'/%3E%3Cstop offset='1' stop-color='%23f8f1e8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='1200' height='600' fill='url(%23g)'/%3E%3Ccircle cx='600' cy='300' r='110' fill='%23fffdf8'/%3E%3Ccircle cx='565' cy='260' r='25' fill='white' opacity='.8'/%3E%3Ctext x='600' y='475' text-anchor='middle' fill='%239a8d7a' font-family='serif' font-size='30' letter-spacing='8'%3EA LITTLE PEARL OF YOURS%3C/text%3E%3C/svg%3E" alt="غلاف راقاد">
<button class="btn cover-upload" type="button" onclick="document.getElementById('coverFile').click()">choose cover photo</button>
<input type="file" id="coverFile" accept="image/*" hidden>

<div class="hint">✦ A SOFT PLACE FOR PRETTY THINGS ✦</div>

<div id="gallery"><p class="empty">Your photos will appear here ✦</p></div>

<div class="upload" onclick="document.getElementById('file').click()">
  <b>✦ add your pearls ✦</b>
  <p>choose your photos & let them shine here</p>
</div>
<input type="file" id="file" accept="image/*" multiple hidden>
<br>
<button class="btn" type="button" id="clearGallery">clear all</button>
<div class="footer">RAGHAD — MADE TO FEEL SOFT 🐚</div>

<script>
  const f = document.getElementById('file');
  const coverFile = document.getElementById('coverFile');
  const hero = document.getElementById('hero');
  const gallery = document.getElementById('gallery');

  function showSelectedImage(file, onLoad) {
    if (!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = () => onLoad(reader.result);
    reader.readAsDataURL(file);
  }

  function addGalleryImage(src, name) {
    gallery.querySelector('.empty')?.remove();
    const card = document.createElement('div');
    card.className = 'card';
    const image = document.createElement('img');
    image.src = src;
    image.alt = name || 'Photo';
    const removeButton = document.createElement('button');
    removeButton.type = 'button';
    removeButton.textContent = '×';
    removeButton.setAttribute('aria-label', 'Remove photo');
    removeButton.addEventListener('click', () => {
      card.remove();
      if (!gallery.querySelector('.card')) {
        gallery.innerHTML = '<p class="empty">Your photos will appear here ✦</p>';
      }
    });
    card.append(image, removeButton);
    gallery.appendChild(card);
  }

  f.addEventListener('change', () => {
    [...f.files].forEach(file => showSelectedImage(file, src => addGalleryImage(src, file.name)));
    f.value = '';
  });

  coverFile.addEventListener('change', () => {
    showSelectedImage(coverFile.files[0], src => { hero.src = src; });
    coverFile.value = '';
  });

  document.getElementById('clearGallery').addEventListener('click', () => {
    gallery.innerHTML = '<p class="empty">Your photos will appear here ✦</p>';
  });
</script>
</body>
</html>
