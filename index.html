<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LULU | لؤلؤ</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { min-height:100vh; color:#25232a; font-family:'IBM Plex Sans Arabic',sans-serif; font-weight:300;
  background:linear-gradient(180deg,#eceaf1 0,#f8f7f9 340px,#f8f7f9 100%); -webkit-font-smoothing:antialiased; }
.container { max-width:440px; margin:auto; padding:56px 24px 32px; text-align:center; }
.logo { width:104px; height:104px; margin:0 auto 20px; display:grid; place-items:center; border-radius:50%; direction:ltr;
  font-family:'Playfair Display',serif; font-style:italic; font-size:30px;
  background:radial-gradient(circle at 32% 28%,#fff 0,#f4f1f6 38%,#dcd6e3 100%); box-shadow:0 14px 34px rgba(60,50,80,.18); }
h1 { font-size:28px; font-weight:500; }
.top-label { margin-top:4px; font-family:'Playfair Display',serif; font-style:italic; font-size:11px; letter-spacing:5px; color:#8b8494; direction:ltr; }
.demo { margin-top:10px; font-size:14px; color:#6f6a76; }
.status { display:inline-flex; align-items:center; gap:8px; margin-top:16px; padding:5px 14px; background:#fff; border:1px solid #e6e3ea; border-radius:99px; font-size:13px; }
.dot { width:7px; height:7px; border-radius:50%; background:#4b9560; }
.welcome { margin:32px 0 24px; }
.welcome h2 { font-size:19px; font-weight:400; margin-bottom:4px; }
.welcome p { font-size:15px; line-height:1.8; color:#6f6a76; }
.links { display:flex; flex-direction:column; gap:12px; }
.link { display:flex; align-items:center; gap:14px; padding:14px 16px; background:#fff; border:1px solid #e9e6ed; border-radius:18px;
  color:#25232a; text-decoration:none; text-align:right; font-size:16px; font-weight:500; transition:transform .2s,box-shadow .2s; }
a.link:hover { transform:translateY(-2px); box-shadow:0 10px 26px rgba(60,50,80,.1); }
.link:focus-visible { outline:2px solid #25232a; outline-offset:3px; }
.links .link:first-child { background:#25232a; border-color:#25232a; color:#fff; }
.icon { width:42px; height:42px; flex-shrink:0; display:grid; place-items:center; background:#f1eff4; border-radius:50%; color:#25232a; }
.label { flex:1; }
.sub { display:block; font-size:12px; font-weight:300; opacity:.75; }
.soon { opacity:.55; }
svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
.arrow { width:18px; height:18px; opacity:.6; }
.footer { margin-top:44px; font-family:'Playfair Display',serif; font-style:italic; font-size:12px; color:#8b8494; direction:ltr; }
@media (prefers-reduced-motion:reduce) { .link { transition:none; } a.link:hover { transform:none; } }
</style>
</head>

<body>

<main class="container">

    <header>
        <div class="logo">Lulu</div>
        <h1>لولو ♡</h1>
        <div class="top-label">LULU • PEARL</div>
        <p class="demo">نموذج تجريبي من تصميمي</p>
        <div class="status"><span class="dot"></span>متاحة الآن</div>
    </header>

    <section class="welcome">
        <h2>أهلاً فيك بعالمي</h2>
        <p>كل روابطي في مكان واحد ♡</p>
    </section>

    <svg style="display:none">
        <symbol id="chevron" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
    </svg>

    <nav class="links">

        <a class="link" href="https://tiktok.com/@nakhlink">
            <span class="icon"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1.2-4.5A8 8 0 1 1 21 12z"/></svg></span>
            <span class="label">اطلب صفحتك<span class="sub">راسلني على تيك توك</span></span>
            <svg class="arrow"><use href="#chevron"/></svg>
        </a>


        <a class="link" href="https://tiktok.com/@nakhlink">
            <span class="icon"><svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg></span>
            <span class="label">تيك توك فيديوهاتي</span>
            <svg class="arrow"><use href="#chevron"/></svg>
        </a>


        <div class="link soon">
            <span class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 16l5-5 5 5 3-3 5 5"/><circle cx="15.5" cy="9.5" r="1"/></svg></span>
            <span class="label">انستقرام<span class="sub">قريباً</span></span>
        </div>


        <div class="link soon">
            <span class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg></span>
            <span class="label">سناب شات<span class="sub">قريباً</span></span>
        </div>

    </nav>

    <footer class="footer">© Lulu 2026 ♡</footer>

</main>

</body>
</html>
