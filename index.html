<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LULU | لولو</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --bg: #fdfbf8;
    --surface: #ffffff;
    --text: #672b29;
    --muted: #856a63;
    --gold: #b99a69;
    --border: #eee6da;
    --tint: #f7f1e8;
    --radius: 16px; /* rounded-2xl */
}

body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Tajawal', sans-serif;
    -webkit-font-smoothing: antialiased;
}

.container {
    max-width: 440px;
    margin: auto;
    padding: 64px 24px 40px;
    text-align: center;
}

/* Header */
.logo {
    width: 104px;
    height: 104px;
    margin: 0 auto 24px;
    display: grid;
    place-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 32px;
    direction: ltr;
}

h1 { font-size: 32px; font-weight: 800; }

.top-label {
    margin-top: 4px;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 12px;
    letter-spacing: 4px;
    color: var(--gold);
    direction: ltr;
}

.status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 20px;
    padding: 6px 16px;
    background: var(--tint);
    border-radius: var(--radius);
    font-size: 14px;
    font-weight: 500;
}

.dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #4b9560;
}

.welcome { margin: 40px 0 32px; }
.welcome h2 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
.welcome p { font-size: 16px; line-height: 1.8; color: var(--muted); }

/* Links */
.links {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.link {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    text-decoration: none;
    text-align: right;
    font-size: 17px;
    font-weight: 700;
    transition: border-color .2s, transform .2s, box-shadow .2s;
}

.link:hover {
    border-color: var(--gold);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(103, 43, 41, .07);
}

.link:focus-visible {
    outline: 2px solid var(--text);
    outline-offset: 3px;
}

.icon {
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    background: var(--tint);
    border-radius: var(--radius);
}

.label { flex: 1; }

svg {
    width: 22px;
    height: 22px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.arrow { width: 18px; height: 18px; color: var(--gold); }

.footer {
    margin-top: 56px;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 13px;
    color: var(--muted);
    direction: ltr;
}

@media (prefers-reduced-motion: reduce) {
    .link { transition: none; }
    .link:hover { transform: none; }
}
</style>
</head>

<body>

<main class="container">

    <header>
        <div class="logo">Lulu</div>
        <h1>لولو ♡</h1>
        <div class="top-label">LULU • PEARL</div>
        <div class="status"><span class="dot"></span>متاحة الآن</div>
    </header>

    <section class="welcome">
        <h2>أهلاً فيك بعالمي</h2>
        <p>كل روابطي في مكان واحد، اضغط على اللي تبيه ♡</p>
    </section>

    <svg style="display:none">
        <symbol id="chevron" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
    </svg>

    <nav class="links">

        <a class="link" href="https://wa.me/966XXXXXXXXX">
            <span class="icon"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1.2-4.5A8 8 0 1 1 21 12z"/></svg></span>
            <span class="label">واتساب سريع</span>
            <svg class="arrow"><use href="#chevron"/></svg>
        </a>

        <a class="link" href="https://instagram.com/USERNAME">
            <span class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 16l5-5 5 5 3-3 5 5"/><circle cx="15.5" cy="9.5" r="1"/></svg></span>
            <span class="label">انستقرام صوري وستوري</span>
            <svg class="arrow"><use href="#chevron"/></svg>
        </a>

        <a class="link" href="https://tiktok.com/@USERNAME">
            <span class="icon"><svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg></span>
            <span class="label">تيك توك فيديوهاتي</span>
            <svg class="arrow"><use href="#chevron"/></svg>
        </a>

        <a class="link" href="https://snapchat.com/add/USERNAME">
            <span class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg></span>
            <span class="label">سناب شات يومياتي</span>
            <svg class="arrow"><use href="#chevron"/></svg>
        </a>

    </nav>

    <footer class="footer">© Lulu 2026 ♡</footer>

</main>

</body>
</html>
